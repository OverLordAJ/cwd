<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unbranding Amazon - Worker Exploitation Critique</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #eee;
      text-align: center;
    }

    header {
      background: #232f3e; /* Amazon dark blue-gray */
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #ff9900; /* Amazon orange */
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .design-wrapper {
      position: relative;
      width: 90%;
      max-width: 800px;
      margin: 0 auto 40px;
      border: 4px solid #ff9900;
      overflow: hidden;
      cursor: pointer;
    }

    .design-img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.4s ease;
    }

    /* Original starts visible */
    #original {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 1;
    }

    #unbranded {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .hover-info {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0.8;
    }

    footer {
      margin-top: 60px;
      padding: 20px;
      background: #111;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Unbranding Amazon</h1>
  </header>

  <div class="container">
    <p>Hover over the design to reveal the critique: Amazon's polished smile hides warehouse exploitation, surveillance, and burnout culture.</p>

    <div class="design-wrapper"
         onmouseover="showUnbranded()"
         onmouseout="showOriginal()">

      <img id="original" class="design-img" src="amazon-original.png" alt="Original Amazon design">
      <img id="unbranded" class="design-img" src="amazon-unbranded.png" alt="Unbranded critique version">
    </div>

    <div class="hover-info">Hover to see the real story →</div>
  </div>

  <footer>
    Made for Critical Web Design – Unit 2
  </footer>

  <!-- 
  Statement / Artist's Note:
  This unbranding targets Amazon's corporate identity, which uses friendly orange, clean sans-serif typography, and smiling arrows to project convenience and customer love. 
  In reality, the company relies on intense worker surveillance, punishing productivity quotas, and anti-union tactics while generating massive wealth for executives. 
  By swapping to a grim, distorted version on hover — with surveillance cameras, exhausted worker silhouettes, broken boxes, and text like "Treats Humans Like Robots" — the piece forces a quick confrontation between brand myth and labor reality. 
  The hover mechanic mimics how the company's glossy surface hides exploitation until you look closer.
  -->

  <script>
    // Get the image elements
    const originalImg = document.getElementById('original');
    const unbrandedImg = document.getElementById('unbranded');

    // Function to show unbranded version (fade original out, unbranded in)
    function showUnbranded() {
      originalImg.style.opacity = '0';
      unbrandedImg.style.opacity = '1';
    }

    // Function to show original again
    function showOriginal() {
      originalImg.style.opacity = '1';
      unbrandedImg.style.opacity = '0';
    }
  </script>

</body>
</html>
