<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// PLAYER
class Dave {
  constructor(x, color) {
    this.x = x;
    this.y = 400;
    this.velY = 0;
    this.color = color;
    this.health = 100;
    this.facing = 1;
  }

  draw() {
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 4;

    // South Park-ish wobble
    let wobble = Math.sin(Date.now() / 100) * 2;

    // Head
    ctx.beginPath();
    ctx.arc(this.x, this.y - 40 + wobble, 10, 0, Math.PI * 2);
    ctx.stroke();

    // Body
    ctx.beginPath();
    ctx.moveTo(this.x, this.y - 30);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    // Arms
    ctx.beginPath();
    ctx.moveTo(this.x, this.y - 20);
    ctx.lineTo(this.x + 15 * this.facing, this.y - 10);
    ctx.stroke();

    // Legs
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - 10, this.y + 20);
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + 10, this.y + 20);
    ctx.stroke();
  }

  update() {
    // Movement
    if (keys["arrowleft"]) {
      this.x -= 4;
      this.facing = -1;
    }
    if (keys["arrowright"]) {
      this.x += 4;
      this.facing = 1;
    }

    // Jump
    if (keys["w"] && this.y >= 400) {
      this.velY = -10;
    }

    this.velY += 0.5;
    this.y += this.velY;

    if (this.y > 400) {
      this.y = 400;
      this.velY = 0;
    }
  }
}

const player = new Dave(200, "red");
const enemy = new Dave(600, "cyan");

// ATTACK EFFECTS
function punch(p, target) {
  if (Math.abs(p.x - target.x) < 60) {
    target.health -= 5;
  }
}

function heavy(p, target) {
  if (Math.abs(p.x - target.x) < 80) {
    target.health -= 10;
  }
}

function cursedEnergy(p, target) {
  if (Math.abs(p.x - target.x) < 120) {
    target.health -= 20;

    // Jujutsu-style effect
    ctx.fillStyle = "purple";
    ctx.beginPath();
    ctx.arc(target.x, target.y - 20, 30, 0, Math.PI * 2);
    ctx.fill();
  }
}

// INPUT ATTACKS
document.addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "z") punch(player, enemy);
  if (e.key.toLowerCase() === "x") heavy(player, enemy);
  if (e.key.toLowerCase() === "c") cursedEnergy(player, enemy);
});

// GAME LOOP
function gameLoop() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  player.update();
  enemy.update();

  player.draw();
  enemy.draw();

  // Health bars
  ctx.fillStyle = "red";
  ctx.fillRect(20, 20, player.health * 2, 10);

  ctx.fillStyle = "cyan";
  ctx.fillRect(600, 20, enemy.health * 2, 10);

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
