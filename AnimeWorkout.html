<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensei — THE DOJO Coach</title>
<style>
  :root{ --blood:#c0392b; --gold:#d4a537; --paper:#f4f1ea; --ink:#14110e; }
  body{ background:var(--ink); margin:0; min-height:100vh; }

  /* ---- Coach widget ---- */
  #coach-fab{
    position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999;
    width:60px; height:60px; border-radius:50%; border:none; cursor:pointer;
    background:var(--blood); color:var(--paper); font-size:1.6rem;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  #coach-panel{
    position:fixed; bottom:6rem; right:1.5rem; z-index:9999;
    width:min(380px, 92vw); height:min(560px, 75vh);
    display:none; flex-direction:column; overflow:hidden;
    background:#1c1712; border:1px solid var(--gold); border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
    font-family:system-ui, sans-serif;
  }
  #coach-panel.open{ display:flex; }
  .coach-head{
    padding:.9rem 1rem; background:var(--blood); color:var(--paper);
    font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:.9rem;
  }
  #coach-log{ flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:.7rem; }
  .msg{ max-width:85%; padding:.6rem .8rem; border-radius:10px; font-size:.9rem; line-height:1.45; white-space:pre-wrap; }
  .msg.user{ align-self:flex-end; background:var(--gold); color:var(--ink); }
  .msg.bot{ align-self:flex-start; background:#2a2119; color:var(--paper); }
  .coach-input{ display:flex; gap:.5rem; padding:.75rem; border-top:1px solid #333; }
  .coach-input input{
    flex:1; padding:.6rem .8rem; border-radius:8px; border:1px solid #444;
    background:#0f0c09; color:var(--paper); font-size:.9rem;
  }
  .coach-input button{
    padding:0 1rem; border:none; border-radius:8px; cursor:pointer;
    background:var(--blood); color:var(--paper); font-weight:700;
  }
  .coach-input button:disabled{ opacity:.5; cursor:default; }
</style>
</head>
<body>

<!-- ===== Coach widget markup ===== -->
<button id="coach-fab" title="Ask Sensei">気</button>
<div id="coach-panel">
  <div class="coach-head">Sensei · Ask the Dojo</div>
  <div id="coach-log"></div>
  <form class="coach-input" id="coach-form">
    <input id="coach-text" autocomplete="off" placeholder="Ask about training…" />
    <button type="submit" id="coach-send">Send</button>
  </form>
</div>

<script>
(function () {
  const fab   = document.getElementById("coach-fab");
  const panel = document.getElementById("coach-panel");
  const log   = document.getElementById("coach-log");
  const form  = document.getElementById("coach-form");
  const input = document.getElementById("coach-text");
  const send  = document.getElementById("coach-send");

  const history = []; // [{role:"user"|"assistant", content:"..."}]

  fab.addEventListener("click", () => {
    panel.classList.toggle("open");
    if (panel.classList.contains("open") && log.children.length === 0) {
      addBubble("bot", "Welcome to the Dojo. Ask me about a workout, an exercise, or your arc.");
    }
    input.focus();
  });

  function addBubble(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "user" : "bot");
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    send.disabled = true;
    addBubble("user", text);
    history.push({ role: "user", content: text });

    const botEl = addBubble("bot", "");
    let full = "";

    try {
      const resp = await fetch("/api/coach", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6);
          if (payload === "[DONE]") continue;
          const data = JSON.parse(payload);
          if (data.error) { full = data.error; }
          else if (data.text) { full += data.text; }
          botEl.textContent = full;
          log.scrollTop = log.scrollHeight;
        }
      }
      history.push({ role: "assistant", content: full });
    } catch (err) {
      botEl.textContent = "Connection to the Dojo failed. Try again.";
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
})();
</script>
</body>
</html>
