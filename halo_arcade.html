<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HALO: Arcade Combat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas {
  display: block;
  border: 1px solid #0f04;
  box-shadow: 0 0 40px #0f04, 0 0 80px #0f02;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =============================================
//  HALO: ARCADE COMBAT  —  Full Game
// =============================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width  = 800;
canvas.height = 500;

// ── AUDIO ──────────────────────────────────────
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(freq, type, dur, vol, freqEnd) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'sine';
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.3, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxShoot()  { tone(900,'square',0.08,0.18,300); }
function sfxHit()    { tone(250,'sawtooth',0.15,0.35,60); }
function sfxDeath()  { tone(400,'square',0.4,0.4,50); }
function sfxJump()   { tone(300,'sine',0.12,0.12,600); }
function sfxPickup() { tone(660,'sine',0.1,0.25,1200); }
function sfxWave()   { tone(440,'sine',0.5,0.3,880); }
function sfxPwrDmg()  { tone(200,'sawtooth',0.05,0.2,800); setTimeout(()=>tone(800,'sawtooth',0.12,0.25,1200),60); }
function sfxPwrInv()  { [0,80,160].forEach(d=>setTimeout(()=>tone(520,'sine',0.12,0.3,1040),d)); }
function sfxPwrHeal() { [0,100,200].forEach((d,i)=>setTimeout(()=>tone(440+i*220,'sine',0.1,0.28,880+i*220),d)); }

// ── INPUT ──────────────────────────────────────
const keys = {};
let mouseDown = false;
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    ensureAudio();
    keys[e.code] = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (gs === 'playing') playerJump();
      else if (gs === 'wave_clear') waveTimer = 1;
      else if (gs === 'menu' || gs === 'gameover') startGame();
    }
    if (e.code === 'Enter' && (gs === 'menu' || gs === 'gameover')) startGame();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousedown', () => {
  ensureAudio();
  mouseDown = true;
  if (gs === 'menu' || gs === 'gameover') startGame();
  else if (gs === 'wave_clear') waveTimer = 1;  // skip countdown, go next wave
});
canvas.addEventListener('mouseup',   () => { mouseDown = false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  mouseDown = true;
  if (gs === 'menu' || gs === 'gameover') startGame();
  else if (gs === 'wave_clear') waveTimer = 1;
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); mouseDown = false; }, { passive: false });

// ── CONSTANTS ──────────────────────────────────
const GRAVITY   = 0.48;
const GROUND_Y  = 418;
const W = canvas.width, H = canvas.height;

// ── PLATFORMS ─────────────────────────────────
const platforms = [
  { x: -400, y: GROUND_Y, w: W + 800, h: 82 },  // ground

  // Low row — easy hops
  { x: 40,  y: 370, w: 80,  h: 12 },
  { x: 200, y: 375, w: 70,  h: 12 },
  { x: 520, y: 372, w: 85,  h: 12 },
  { x: 680, y: 368, w: 75,  h: 12 },

  // Mid row — main combat platforms
  { x: 100, y: 310, w: 120, h: 12 },
  { x: 310, y: 318, w: 100, h: 12 },
  { x: 490, y: 305, w: 130, h: 12 },
  { x: 660, y: 315, w: 100, h: 12 },

  // High row — sniper perches
  { x: 30,  y: 235, w: 90,  h: 12 },
  { x: 210, y: 220, w: 80,  h: 12 },
  { x: 380, y: 210, w: 100, h: 12 },
  { x: 560, y: 225, w: 90,  h: 12 },
  { x: 700, y: 240, w: 80,  h: 12 },

  // Top row — risky high ground
  { x: 120, y: 148, w: 70,  h: 12 },
  { x: 340, y: 138, w: 120, h: 12 },
  { x: 590, y: 152, w: 80,  h: 12 },

  // Floating mid connectors
  { x: 265, y: 270, w: 55,  h: 12 },
  { x: 455, y: 258, w: 55,  h: 12 },
  { x: 640, y: 268, w: 50,  h: 12 },
];

// ── STARS (pre-computed) ───────────────────────
const STARS = Array.from({ length: 90 }, (_, i) => ({
  x: ((i * 137 + 71) % W),
  y: ((i * 97  + 23) % 290),
  r: i % 4 === 0 ? 1.4 : 0.7,
  a: 0.4 + (i % 5) * 0.12,
}));

// ── GAME STATE ─────────────────────────────────
let gs = 'menu';   // menu | playing | wave_clear | gameover
let score = 0, wave = 1, highScore = 0;
let waveTimer = 0;
let shakeX = 0, shakeY = 0, shakeDur = 0;

// ── ENTITIES ───────────────────────────────────
let player, enemies, bullets, eBullets, particles, pickups;

function createPlayer() {
  return {
    x: 380, y: 300, w: 28, h: 48,
    vx: 0, vy: 0, onGround: false,
    facing: 1,
    shield: 100,
    health: 3,
    lastHit: -9999,
    shootCD: 0,
    walkT: 0,
    invincible: 0,
    // Power-ups (frames remaining, 0 = inactive)
    pwrDmg:  0,   // Damage Boost — bullets deal 3x damage
    pwrInv:  0,   // Overshield  — full invincibility
    pwrHeal: 0,
    // Single-shot: track if mouse was already down last frame
    prevMouseDown: false,
    burstCount: 0,
    burstTimer: 0,
  };
}

function mkGrunt(x) {
  return {
    type: 'grunt', x, y: GROUND_Y - 35,
    w: 24, h: 34, vx: 0, vy: 0, onGround: false,
    hp: 1, maxHp: 1,
    facing: x < W / 2 ? 1 : -1,
    shootCD: 80 + Math.random() * 80,
    walkT: 0, dead: false,
  };
}
function mkElite(x) {
  return {
    type: 'elite', x, y: GROUND_Y - 57,
    w: 32, h: 56, vx: 0, vy: 0, onGround: false,
    hp: 3, maxHp: 3,
    facing: x < W / 2 ? 1 : -1,
    shootCD: 50 + Math.random() * 60,
    walkT: 0, dead: false,
  };
}
function mkHunter(x) {
  return {
    type: 'hunter', x, y: GROUND_Y - 71,
    w: 40, h: 70, vx: 0, vy: 0, onGround: false,
    hp: 6, maxHp: 6,
    facing: x < W / 2 ? 1 : -1,
    shootCD: 90 + Math.random() * 40,
    walkT: 0, dead: false,
  };
}

// Boss: massive Flood-Juggernaut, appears at waves 10, 20, 30 …
function mkBoss(x, wave) {
  const tier = Math.floor(wave / 10);   // scales with milestone
  return {
    type: 'boss', x, y: GROUND_Y - 111,
    w: 64, h: 110, vx: 0, vy: 0, onGround: false,
    hp: 30 + tier * 20, maxHp: 30 + tier * 20,
    facing: x < W / 2 ? 1 : -1,
    shootCD: 55, walkT: 0, dead: false,
    tier,                               // used for color variants
  };
}

// ── WAVE FORMULA ───────────────────────────────
// Returns { grunts, elites, hunters, bosses } counts for wave w
function waveComposition(w) {
  const isBoss = w % 10 === 0;
  if (isBoss) {
    const tier = w / 10;
    return {
      grunts:  Math.min(4 + tier * 2, 14),
      elites:  Math.min(tier * 2, 10),
      hunters: Math.min(Math.floor(tier / 2), 4),
      bosses:  1,
    };
  }
  return {
    grunts:  Math.min(2 + w * 3, 18),
    elites:  Math.max(0, Math.min(Math.floor((w - 1) / 1.5), 12)),
    hunters: Math.max(0, Math.min(Math.floor((w - 3) / 2), 6)),
    bosses:  0,
  };
}

// Spawn positions just off the screen edges so enemies land on ground immediately
function edgeX(index) {
  // alternate left/right, offset so they don't stack
  return index % 2 === 0
    ? -(50 + Math.floor(index / 2) * 55)   // left side, staggered
    : W + 50 + Math.floor(index / 2) * 55; // right side, staggered
}

function spawnWave(w) {
  enemies = [];

  // All enemy types available in Halo
  const TYPES = ['grunt', 'grunt', 'grunt', 'elite', 'hunter']; // weighted toward grunts early

  const isBoss = w % 10 === 0;

  if (isBoss) {
    const tier = w / 10;
    const { grunts, elites, hunters } = waveComposition(w);
    let idx = 0;
    for (let i = 0; i < grunts;  i++) enemies.push(mkEnemy('grunt',   edgeX(idx++)));
    for (let i = 0; i < elites;  i++) enemies.push(mkEnemy('elite',   edgeX(idx++)));
    for (let i = 0; i < hunters; i++) enemies.push(mkEnemy('hunter',  edgeX(idx++)));
    enemies.push(mkBoss(idx % 2 === 0 ? -120 : W + 120, w));
    return;
  }

  // Normal waves: randomized mix based on wave number
  const totalEnemies = Math.min(3 + w * 2, 20);
  for (let i = 0; i < totalEnemies; i++) {
    // Unlock types progressively
    let roll = Math.random();
    let type;
    if (w < 2)      type = 'grunt';
    else if (w < 4) type = roll < 0.75 ? 'grunt' : 'elite';
    else if (w < 7) type = roll < 0.55 ? 'grunt' : roll < 0.85 ? 'elite' : 'hunter';
    else            type = roll < 0.40 ? 'grunt' : roll < 0.70 ? 'elite' : 'hunter';

    enemies.push(mkEnemy(type, edgeX(i)));
  }
}

// Single enemy factory — all types use ground-level Y
function mkEnemy(type, x) {
  if (type === 'grunt')  return mkGrunt(x);
  if (type === 'elite')  return mkElite(x);
  if (type === 'hunter') return mkHunter(x);
  return mkGrunt(x);
}

function startGame() {
  ensureAudio();
  score = 0; wave = 1;
  gs = 'playing';
  player   = createPlayer();
  enemies  = [];
  bullets  = [];
  eBullets = [];
  particles= [];
  pickups  = [];
  spawnWave(wave);
}

// ── PHYSICS ────────────────────────────────────
function physics(ent) {
  ent.vy += GRAVITY;
  ent.x  += ent.vx;
  ent.y  += ent.vy;
  ent.onGround = false;
  for (const p of platforms) {
    if (ent.x + ent.w > p.x && ent.x < p.x + p.w &&
        ent.y + ent.h > p.y && ent.y + ent.h < p.y + p.h + 14 && ent.vy >= 0) {
      ent.y = p.y - ent.h;
      ent.vy = 0;
      ent.onGround = true;
    }
  }
}

function playerJump() {
  if (player.onGround) { player.vy = -12.5; sfxJump(); }
}

function shoot() {
  if (player.shootCD > 0) return;
  // Trigger burst on fresh click only
  if (!mouseDown || player.prevMouseDown) return;
  player.burstCount = 3;      // 3-round burst
  player.burstTimer = 0;      // fire first round immediately
}

function processBurst() {
  if (!player.burstCount || player.burstCount <= 0) return;
  player.burstTimer--;
  if (player.burstTimer > 0) return;

  // Fire one round
  sfxShoot();
  const bx  = player.facing === 1 ? player.x + player.w + 2 : player.x - 2;
  const dmg = player.pwrDmg > 0 ? 3 : 1;
  const col = player.pwrDmg > 0 ? '#ff4400' : '#ffe844';
  // Tiny vertical spread per round so they're visually distinct
  const spread = (3 - player.burstCount) * 3;
  bullets.push({ x: bx, y: player.y + 20 + spread, vx: player.facing * 16, vy: 0, life: 55, dmg, col });
  const flashCol = player.pwrDmg > 0 ? '#ff8800' : '#ffe844';
  for (let i = 0; i < 4; i++) spark(bx, player.y + 20 + spread, flashCol, 2);

  player.burstCount--;
  if (player.burstCount > 0) {
    player.burstTimer = 7;   // frames between burst rounds
  } else {
    player.shootCD = player.pwrDmg > 0 ? 20 : 28;  // cooldown before next burst
  }
}

function enemyShoot(e) {
  const dx = (player.x + 14) - (e.x + e.w / 2);
  const dy = (player.y + 24) - (e.y + e.h / 2);
  const d  = Math.hypot(dx, dy);
  if (d > 800) return;

  const spd = e.type === 'boss' ? 5 + (e.tier||1) * 0.5 : e.type === 'hunter' ? 5.5 : e.type === 'elite' ? 5 : 4.5;
  const dmg = e.type === 'boss' ? 55 : e.type === 'hunter' ? 40 : e.type === 'elite' ? 22 : 15;
  const col = e.type === 'boss'
    ? ((e.tier||1) >= 3 ? '#ff00ff' : (e.tier||1) >= 2 ? '#ff8800' : '#ffdd00')
    : e.type === 'hunter' ? '#00ffcc' : e.type === 'elite' ? '#ff4400' : '#44aaff';
  const r   = e.type === 'boss' ? 7 : e.type === 'hunter' ? 6 : e.type === 'elite' ? 5 : 4;

  // Single aimed shot for all enemy types
  eBullets.push({
    x: e.x + e.w / 2, y: e.y + e.h / 2,
    vx: dx / d * spd, vy: dy / d * spd,
    life: 110, col, r, dmg,
  });
}

// ── PARTICLES ──────────────────────────────────
function spark(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1.5, life: 20 + Math.random()*20, ml: 40, col, r: 1.5 + Math.random()*2.5 });
  }
}

function shake(amt, dur) { shakeX = amt; shakeY = amt; shakeDur = dur; }

// ── UPDATE ─────────────────────────────────────
function update() {
  if (gs !== 'playing' && gs !== 'wave_clear') return;

  // Screen shake
  if (shakeDur > 0) { shakeX = (Math.random()-.5)*7; shakeY = (Math.random()-.5)*7; shakeDur--; }
  else              { shakeX = 0; shakeY = 0; }

  if (gs === 'wave_clear') {
    waveTimer--;
    if (waveTimer <= 0) {
      wave++;
      spawnWave(wave);
      gs = 'playing';
      sfxWave();
    }
    return;
  }

  // ── Player movement
  if (keys['KeyA'] || keys['ArrowLeft'])  { player.vx = -5.2; player.facing = -1; }
  else if (keys['KeyD'] || keys['ArrowRight']) { player.vx = 5.2; player.facing = 1; }
  else { player.vx *= 0.68; if (Math.abs(player.vx) < 0.1) player.vx = 0; }

  if (player.vx !== 0 && player.onGround) player.walkT++;

  // Burst fire
  shoot();
  processBurst();
  player.prevMouseDown = mouseDown;

  player.shootCD    = Math.max(0, player.shootCD - 1);
  player.invincible = Math.max(0, player.invincible - 1);
  player.pwrDmg     = Math.max(0, player.pwrDmg - 1);
  player.pwrInv     = Math.max(0, player.pwrInv - 1);

  physics(player);
  // Pac-Man wrap — exit left = enter right, exit right = enter left
  if (player.x + player.w < 0)  player.x = W;
  if (player.x > W)             player.x = -player.w;

  // Shield regen
  if (Date.now() - player.lastHit > 3200 && player.shield < 100)
    player.shield = Math.min(100, player.shield + 0.45);

  // ── Enemies
  for (const e of enemies) {
    if (e.dead) continue;
    const dx   = (player.x + 14) - (e.x + e.w/2);
    const spd  = e.type === 'boss' ? 0.7 : e.type === 'hunter' ? 0.9 : e.type === 'elite' ? 1.3 : 0.95;
    const stop = e.type === 'boss' ? 160 : e.type === 'hunter' ? 120 : 90;

    if (Math.abs(dx) > stop) {
      e.vx     = dx > 0 ? spd : -spd;
      e.facing = dx > 0 ? 1 : -1;
    } else { e.vx *= 0.75; }

    physics(e);
    if (e.vx !== 0) e.walkT++;

    e.shootCD--;
    if (e.shootCD <= 0) {
      enemyShoot(e);
      const base = e.type === 'boss' ? 65 : e.type === 'hunter' ? 80 : e.type === 'elite' ? 55 : 100;
      e.shootCD = base + Math.random() * 60;
    }
  }
  enemies = enemies.filter(e => !e.dead);

  if (enemies.length === 0) {
    gs = 'wave_clear';
    waveTimer = 1200;   // 20 seconds at 60fps
    player.shield = Math.min(100, player.shield + 35);
  }

  // ── Player bullets vs enemies
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    for (const e of enemies) {
      if (e.dead) continue;
      if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
        b.life = 0;
        spark(b.x, b.y, b.col || '#ffe844', 4);
        e.hp -= (b.dmg || 1);
        if (e.hp <= 0) {
          e.dead = true; sfxDeath();
          const col = e.type === 'boss' ? '#ffdd00' : e.type === 'hunter' ? '#00ffcc' : e.type === 'elite' ? '#ff5500' : '#5588ff';
          spark(e.x + e.w/2, e.y + e.h/2, col, e.type === 'boss' ? 40 : 18);
          shake(e.type === 'boss' ? 10 : 4, e.type === 'boss' ? 30 : 12);
          score += e.type === 'boss' ? 5000 * (e.tier || 1) : e.type === 'hunter' ? 1000 : e.type === 'elite' ? 500 : 100;
          const dropChance = e.type === 'boss' ? 1.0 : e.type === 'hunter' ? 0.6 : 0.35;
          if (Math.random() < dropChance) {
            // Weighted drop table: ammo most common, power-ups rarer
            const roll = Math.random();
            let dropType;
            if (e.type === 'boss') {
              // Boss always drops one of each power-up + ammo
              ['dmg','inv','heal','ammo'].forEach((t, i) => {
                pickups.push({ x: e.x + e.w/2 + (i-1.5)*28, y: e.y, type: t, life: 500, bobT: i*20 });
              });
              dropType = null; // already handled
            } else {
              dropType = roll < 0.50 ? 'ammo'
                       : roll < 0.70 ? 'dmg'
                       : roll < 0.85 ? 'inv'
                       : 'heal';
            }
            if (dropType) pickups.push({ x: e.x + e.w/2, y: e.y, type: dropType, life: 450, bobT: 0 });
          }
        }
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20);

  // ── Enemy bullets vs player
  for (const b of eBullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    const blocked = player.invincible > 0 || player.pwrInv > 0;
    if (!blocked &&
        b.x > player.x && b.x < player.x + player.w &&
        b.y > player.y && b.y < player.y + player.h) {
      b.life = 0; sfxHit();
      spark(b.x, b.y, b.col, 6);
      player.lastHit = Date.now();
      if (player.shield > 0) {
        player.shield = Math.max(0, player.shield - b.dmg);
      } else {
        player.health--;
        player.invincible = 100;
        shake(6, 22);
        if (player.health <= 0) {
          gs = 'gameover';
          if (score > highScore) highScore = score;
        }
      }
    }
  }
  eBullets = eBullets.filter(b => b.life > 0 && b.x > -50 && b.x < W+50 && b.y < H+50);

  // ── Particles
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.94; p.life--; }
  particles = particles.filter(p => p.life > 0);

  // ── Pickups
  for (const pk of pickups) {
    pk.life--;
    // Bob up and down
    pk.bobT = (pk.bobT || 0) + 1;
    pk.drawY = pk.y - Math.sin(pk.bobT * 0.06) * 6;

    const cx = player.x + 14, cy = player.y + 24;
    if (Math.abs(pk.x - cx) < 28 && Math.abs(pk.drawY - cy) < 38) {
      pk.life = 0;
      if (pk.type === 'ammo') {
        player.ammo = Math.min(player.maxAmmo, player.ammo + 16);
        sfxPickup();
      } else if (pk.type === 'dmg') {
        player.pwrDmg = 600;   // ~10 seconds
        sfxPwrDmg();
        shake(3, 8);
      } else if (pk.type === 'inv') {
        player.pwrInv = 480;   // ~8 seconds
        sfxPwrInv();
        shake(3, 8);
      } else if (pk.type === 'heal') {
        player.health = Math.min(3, player.health + 1);
        player.shield = 100;
        sfxPwrHeal();
        shake(2, 6);
      }
    }
  }
  pickups = pickups.filter(pk => pk.life > 0);
}

// ── DRAW HELPERS ──────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── SPRITE: Master Chief ───────────────────────
function drawChief(x, y, facing, walkT, shield, inv) {
  ctx.save();
  ctx.translate(x + 14, y);
  if (facing === -1) ctx.scale(-1, 1);
  if (inv > 0 && Math.floor(inv / 5) % 2 === 0) ctx.globalAlpha = 0.35;

  const lo = Math.sin(walkT * 0.22) * 5;

  // Legs
  ctx.fillStyle = '#1a5c1a';
  ctx.fillRect(-7, 28, 8, 17 + Math.max(0, lo));
  ctx.fillStyle = '#166616';
  ctx.fillRect(1, 28, 8, 17 + Math.max(0, -lo));
  ctx.fillStyle = '#111';
  ctx.fillRect(-8, 44 + Math.max(0, lo),  10, 5);
  ctx.fillRect(0,  44 + Math.max(0, -lo), 10, 5);

// ── SPRITE: Boss (Flood Juggernaut) ───────────
function drawBoss(x, y, facing, walkT, tier) {
  ctx.save();
  ctx.translate(x + 32, y);
  if (facing === -1) ctx.scale(-1, 1);

  const lo = Math.sin(walkT * 0.12) * 8;
  // Tier color themes: 1=gold, 2=orange, 3+=purple
  const tc  = tier >= 3 ? '#aa00ff' : tier >= 2 ? '#ff6600' : '#ddaa00';
  const tc2 = tier >= 3 ? '#cc44ff' : tier >= 2 ? '#ff9944' : '#ffdd44';
  const tc3 = tier >= 3 ? '#7700cc' : tier >= 2 ? '#cc4400' : '#aa7700';
  const glow = tier >= 3 ? '#ff00ff' : tier >= 2 ? '#ff8800' : '#ffdd00';

  // Legs (enormous)
  ctx.fillStyle = tc3;
  ctx.fillRect(-16, 68, 18, 38 + Math.max(0, lo));
  ctx.fillRect(4, 68, 18, 38 + Math.max(0, -lo));
  ctx.fillStyle = '#111';
  ctx.fillRect(-18, 104 + Math.max(0, lo), 22, 8);
  ctx.fillRect(3, 104 + Math.max(0, -lo), 22, 8);
  // Knee spikes
  ctx.fillStyle = tc2;
  ctx.fillRect(-14, 80, 5, 5);
  ctx.fillRect(10, 80, 5, 5);

  // Body (massive, armored)
  const bg = ctx.createLinearGradient(-24, 28, 24, 28);
  bg.addColorStop(0, tc3); bg.addColorStop(0.4, tc); bg.addColorStop(1, tc3);
  ctx.fillStyle = bg;
  ctx.fillRect(-24, 28, 50, 44);
  // Chest plates
  ctx.fillStyle = tc2;
  ctx.fillRect(-22, 30, 18, 20);
  ctx.fillRect(6, 30, 18, 20);
  // Spine column
  ctx.fillStyle = tc3;
  ctx.fillRect(-4, 28, 10, 44);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = tc2;
    ctx.fillRect(-2, 31 + i*8, 6, 4);
  }
  // Shoulder spikes
  ctx.fillStyle = tc2;
  ctx.fillRect(-30, 26, 10, 8);
  ctx.fillRect(22, 26, 10, 8);
  ctx.fillStyle = tc;
  // Spike tips
  ctx.beginPath(); ctx.moveTo(-30, 26); ctx.lineTo(-36, 20); ctx.lineTo(-26, 26); ctx.fill();
  ctx.beginPath(); ctx.moveTo(32, 26); ctx.lineTo(38, 20); ctx.lineTo(28, 26); ctx.fill();

  // Arms (huge)
  ctx.fillStyle = tc3;
  ctx.fillRect(-32, 30, 12, 36);
  ctx.fillRect(22, 30, 12, 36);
  // Forearm blades
  ctx.fillStyle = tc2;
  ctx.fillRect(-34, 52, 7, 18);
  ctx.fillRect(29, 52, 7, 18);

  // Gravity Hammer / Energy weapon
  ctx.fillStyle = '#222';
  ctx.fillRect(26, 40, 10, 42);
  ctx.fillStyle = tc;
  ctx.fillRect(24, 38, 20, 10);
  ctx.fillRect(22, 70, 24, 12);
  ctx.fillStyle = glow;
  ctx.shadowColor = glow; ctx.shadowBlur = 18;
  ctx.fillRect(24, 72, 20, 8);
  ctx.shadowBlur = 0;

  // Neck
  ctx.fillStyle = tc3;
  ctx.fillRect(-8, 16, 18, 16);

  // Head (large, angular)
  const hg = ctx.createLinearGradient(-16, 0, 16, 0);
  hg.addColorStop(0, tc3); hg.addColorStop(0.5, tc); hg.addColorStop(1, tc3);
  ctx.fillStyle = hg;
  ctx.fillRect(-16, -4, 34, 24);
  // Brow ridge
  ctx.fillStyle = tc3;
  ctx.fillRect(-16, -4, 34, 7);
  // Crown spikes
  ctx.fillStyle = tc2;
  for (let i = -12; i <= 12; i += 8) {
    ctx.beginPath(); ctx.moveTo(i, -4); ctx.lineTo(i + 3, -16); ctx.lineTo(i + 6, -4); ctx.fill();
  }

  // Eyes — glowing, three across
  ctx.shadowColor = glow; ctx.shadowBlur = 14;
  ctx.fillStyle = glow;
  ctx.fillRect(-12, 2, 7, 7);
  ctx.fillRect(-1, 2, 7, 7);
  ctx.fillRect(7, 2, 7, 7);
  ctx.shadowBlur = 0;
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.fillRect(-11, 3, 3, 3);
  ctx.fillRect(0, 3, 3, 3);
  ctx.fillRect(8, 3, 3, 3);

  // Maw
  ctx.fillStyle = '#000';
  ctx.fillRect(-8, 12, 18, 6);
  ctx.fillStyle = tc2;
  for (let i = -6; i <= 10; i += 5) {
    ctx.fillRect(i, 12, 3, 4);
  }

  // Tier badge
  ctx.fillStyle = glow; ctx.shadowColor = glow; ctx.shadowBlur = 8;
  ctx.font = `bold 9px Courier New`;
  ctx.textAlign = 'center';
  ctx.fillText(`T${tier}`, 1, -18);
  ctx.shadowBlur = 0; ctx.textAlign = 'left';

  ctx.restore();
}

// ── DRAW BACKGROUND ───────────────────────────
function drawBG() {
  // Sky gradient
  const sg = ctx.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, '#000a12'); sg.addColorStop(0.55, '#001322'); sg.addColorStop(1, '#002214');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of STARS) {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Halo ring
  ctx.save();
  ctx.globalAlpha = 0.13;
  ctx.strokeStyle = '#88ffaa';
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.ellipse(400, -30, 330, 145, 0, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#55ff77';
  ctx.beginPath(); ctx.ellipse(400, -30, 320, 135, 0, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 0.06;
  ctx.strokeStyle = '#aaffcc';
  ctx.lineWidth = 28;
  ctx.beginPath(); ctx.ellipse(400, -30, 330, 145, 0, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // Platforms
  for (const p of platforms) {
    if (p.h > 20) {
      const gg = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      gg.addColorStop(0, '#1e4d1e'); gg.addColorStop(0.08, '#163816'); gg.addColorStop(1, '#080e08');
      ctx.fillStyle = gg;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      // glow edge
      ctx.fillStyle = 'rgba(60,255,60,0.18)';
      ctx.fillRect(p.x, p.y, p.w, 2);
      ctx.fillStyle = 'rgba(40,200,40,0.1)';
      ctx.fillRect(p.x, p.y + 2, p.w, 1);
    } else {
      ctx.fillStyle = '#1a3d1a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = 'rgba(80,255,80,0.3)';
      ctx.fillRect(p.x, p.y, p.w, 2);
      ctx.fillStyle = '#0a1e0a';
      ctx.fillRect(p.x, p.y + p.h - 2, p.w, 2);
      // Platform glow underneath
      const pg = ctx.createLinearGradient(0, p.y + p.h, 0, p.y + p.h + 12);
      pg.addColorStop(0, 'rgba(40,180,40,0.08)');
      pg.addColorStop(1, 'transparent');
      ctx.fillStyle = pg;
      ctx.fillRect(p.x, p.y + p.h, p.w, 12);
    }
  }
}

// ── DRAW HUD ──────────────────────────────────
function drawHUD() {
  ctx.save();
  // Shield bar
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(14, 14, 208, 20, 3); ctx.fill();
  const sc = player.shield > 50 ? '#22ffcc' : player.shield > 25 ? '#ffaa00' : '#ff2222';
  ctx.fillStyle = sc;
  roundRect(16, 16, Math.max(0, player.shield * 2.04), 16, 2); ctx.fill();
  ctx.strokeStyle = '#33ddcc'; ctx.lineWidth = 1;
  roundRect(14, 14, 208, 20, 3); ctx.stroke();
  ctx.fillStyle = '#33ddcc'; ctx.font = 'bold 9px Courier New';
  ctx.fillText('SHIELDS', 18, 28);

  // Health pips
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < player.health ? '#ff3344' : '#2a0a10';
    roundRect(14 + i*26, 38, 22, 12, 2); ctx.fill();
    ctx.strokeStyle = '#ff5566'; ctx.lineWidth = 1;
    roundRect(14 + i*26, 38, 22, 12, 2); ctx.stroke();
  }
  ctx.fillStyle = '#ff7788'; ctx.font = 'bold 8px Courier New';
  ctx.fillText('HEALTH', 90, 47);

  // Controls
  ctx.fillStyle = 'rgba(120,180,120,0.4)';
  ctx.font = '8px Courier New';
  ctx.fillText('A/D: Move   W/SPACE: Jump   CLICK: Shoot', 14, H - 7);

  // Score (top right)
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'right';
  ctx.fillText(`SCORE  ${score.toString().padStart(6,'0')}`, W - 14, 28);
  ctx.fillStyle = '#888';
  ctx.font = '10px Courier New';
  ctx.fillText(`BEST  ${highScore.toString().padStart(6,'0')}`, W - 14, 44);
  ctx.textAlign = 'left';

  // Wave (center)
  const isBossWave = wave % 10 === 0 && gs === 'playing';
  const wPulse = 0.7 + Math.sin(Date.now() * 0.008) * 0.3;
  ctx.fillStyle = isBossWave ? `rgba(255,${Math.floor(100 * wPulse)},0,${wPulse})` : '#ffee44';
  ctx.font = `bold ${isBossWave ? 13 : 12}px Courier New`;
  ctx.textAlign = 'center';
  ctx.shadowColor = isBossWave ? '#ff4400' : 'transparent';
  ctx.shadowBlur  = isBossWave ? 10 : 0;
  ctx.fillText(isBossWave ? `⚠ BOSS WAVE ${wave} ⚠` : `── WAVE ${wave} ──`, W/2, 26);
  ctx.shadowBlur = 0;
  ctx.fillStyle = enemies.length > 0 ? '#ff8844' : '#44ff88';
  ctx.font = '10px Courier New';
  ctx.fillText(`ENEMIES: ${enemies.length}`, W/2, 42);
  ctx.textAlign = 'left';

  // Controls
  ctx.fillStyle = 'rgba(120,180,120,0.4)';
  ctx.font = '8px Courier New';
  ctx.fillText('A/D: Move   W/SPACE: Jump   CLICK: Fire   R: Reload', 14, H - 7);

  // ── Active power-up bars (bottom right)
  const pwrs = [
    { key: 'pwrDmg', max: 600, label: '⚡DMG+', col: '#ff6600', bg: '#331100' },
    { key: 'pwrInv', max: 480, label: '🛡INV',  col: '#00ccff', bg: '#001133' },
  ];
  let pY = H - 7;
  for (const pw of pwrs) {
    const val = player[pw.key];
    if (val <= 0) continue;
    pY -= 16;
    const bw = 120, frac = val / pw.max;
    ctx.fillStyle = pw.bg;
    roundRect(W - 14 - bw, pY - 10, bw, 12, 2); ctx.fill();
    ctx.fillStyle = pw.col;
    roundRect(W - 14 - bw, pY - 10, bw * frac, 12, 2); ctx.fill();
    ctx.strokeStyle = pw.col; ctx.lineWidth = 0.8;
    roundRect(W - 14 - bw, pY - 10, bw, 12, 2); ctx.stroke();
    // Pulse glow when < 3 seconds left
    if (val < 180 && Math.floor(Date.now() / 250) % 2 === 0) {
      ctx.fillStyle = '#fff';
    } else {
      ctx.fillStyle = pw.col;
    }
    ctx.font = 'bold 8px Courier New'; ctx.textAlign = 'right';
    ctx.fillText(pw.label, W - 16, pY);
    ctx.textAlign = 'left';
  }
  ctx.restore();
}

// ── DRAW MENU ─────────────────────────────────
function drawMenu() {
  drawBG();
  ctx.save();
  ctx.textAlign = 'center';

  // Decorative ring
  ctx.globalAlpha = 0.08;
  ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 60;
  ctx.beginPath(); ctx.ellipse(W/2, H/2 + 60, 280, 120, 0, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.shadowColor = '#00ff66'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#00ff66'; ctx.font = 'bold 72px Courier New';
  ctx.fillText('HALO', W/2, 155);

  ctx.shadowBlur = 8;
  ctx.fillStyle = '#aaffaa'; ctx.font = 'bold 20px Courier New';
  ctx.fillText('ARCADE COMBAT', W/2, 193);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#557755'; ctx.font = '12px Courier New';
  ctx.fillText('── CONTROLS ──', W/2, 250);
  const ctrls = ['A / D  —  Move', 'W / ↑ / SPACE  —  Jump', 'CLICK  —  Shoot (single shot)'];
  ctx.fillStyle = '#889988'; ctx.font = '11px Courier New';
  ctrls.forEach((c, i) => ctx.fillText(c, W/2, 272 + i*18));

  const pulse = 0.65 + Math.sin(Date.now() * 0.004) * 0.35;
  ctx.fillStyle = `rgba(0,255,100,${pulse})`;
  ctx.font = 'bold 15px Courier New';
  ctx.fillText('▶  CLICK OR PRESS SPACE TO BEGIN  ◀', W/2, 400);

  if (highScore > 0) {
    ctx.fillStyle = '#ffee44'; ctx.font = '12px Courier New';
    ctx.fillText(`BEST SCORE:  ${highScore}`, W/2, 432);
  }

  ctx.restore();
}

// ── DRAW GAME OVER ────────────────────────────
function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  ctx.shadowColor = '#ff1122'; ctx.shadowBlur = 24;
  ctx.fillStyle = '#ff1122'; ctx.font = 'bold 58px Courier New';
  ctx.fillText('GAME OVER', W/2, 200);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Courier New';
  ctx.fillText(`SCORE:  ${score}`, W/2, 255);
  ctx.fillStyle = '#ffee44'; ctx.font = '14px Courier New';
  ctx.fillText(`BEST:   ${highScore}`, W/2, 278);
  ctx.fillStyle = '#aaaaaa'; ctx.font = '12px Courier New';
  ctx.fillText(`WAVE REACHED:  ${wave}`, W/2, 302);

  const pulse = 0.65 + Math.sin(Date.now() * 0.005) * 0.35;
  ctx.fillStyle = `rgba(0,255,100,${pulse})`;
  ctx.font = 'bold 15px Courier New';
  ctx.fillText('▶  CLICK OR PRESS SPACE TO RETRY  ◀', W/2, 385);

  ctx.restore();
}

// ── DRAW WAVE CLEAR ───────────────────────────
function drawWaveClear() {
  ctx.save();
  const clearedWave = wave;
  const nextWave    = wave + 1;
  const bossNext    = nextWave % 10 === 0;
  const totalNext   = Math.min(3 + nextWave * 2, 20) + (bossNext ? 1 : 0);
  const secsLeft    = Math.ceil(waveTimer / 60);
  const frac        = waveTimer / 1200;

  ctx.fillStyle = 'rgba(0,18,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  // Cleared banner
  ctx.shadowColor = '#00ff66'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#00ff66'; ctx.font = 'bold 38px Courier New';
  ctx.fillText(`WAVE ${clearedWave} CLEARED!`, W/2, 145);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#55aa55'; ctx.font = '12px Courier New';
  ctx.fillText('SHIELDS PARTIALLY RESTORED', W/2, 172);

  // ── Countdown ring
  const cx = W / 2, cy = 285, radius = 68;

  // Ring background
  ctx.strokeStyle = 'rgba(0,80,0,0.5)';
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();

  // Countdown arc — sweeps from top, drains as time passes
  const pulse = 0.85 + Math.sin(Date.now() * 0.01) * 0.15;
  const arcCol = secsLeft <= 5 ? `rgba(255,60,0,${pulse})` : secsLeft <= 10 ? `rgba(255,200,0,${pulse})` : `rgba(0,255,100,${pulse})`;
  ctx.strokeStyle = arcCol;
  ctx.shadowColor = arcCol; ctx.shadowBlur = 18;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.lineCap = 'butt';

  // Second number inside ring
  const numCol = secsLeft <= 5 ? '#ff4400' : secsLeft <= 10 ? '#ffcc00' : '#00ff88';
  ctx.fillStyle = numCol;
  ctx.shadowColor = numCol; ctx.shadowBlur = 12;
  ctx.font = `bold ${secsLeft >= 10 ? 52 : 62}px Courier New`;
  ctx.fillText(secsLeft, cx, cy + 20);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(150,200,150,0.6)';
  ctx.font = '11px Courier New';
  ctx.fillText('NEXT WAVE IN', cx, cy - 82);

  // Next wave info
  ctx.fillStyle = '#aaffaa'; ctx.font = 'bold 15px Courier New';
  ctx.fillText(`▶  WAVE ${nextWave}  ·  ${totalNext} ENEMIES`, W/2, 385);

  // Boss warning
  if (bossNext) {
    const p = 0.6 + Math.sin(Date.now() * 0.01) * 0.4;
    ctx.fillStyle = `rgba(255,60,0,${p})`;
    ctx.font = 'bold 22px Courier New';
    ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 18;
    ctx.fillText('⚠  BOSS WAVE INCOMING  ⚠', W/2, 425);
    ctx.shadowBlur = 0;
    const tier = nextWave / 10;
    const tname = tier >= 3 ? 'SHADOW JUGGERNAUT' : tier >= 2 ? 'INFERNO JUGGERNAUT' : 'FLOOD JUGGERNAUT';
    ctx.fillStyle = `rgba(255,180,0,${p})`;
    ctx.font = '12px Courier New';
    ctx.fillText(`[ ${tname}  ·  TIER ${tier} ]`, W/2, 446);
  }

  ctx.restore();
}

// ── RENDER ────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(shakeX, shakeY);

  if (gs === 'menu') { drawBG(); drawMenu(); ctx.restore(); return; }

  drawBG();

  // Pickups
  for (const pk of pickups) {
    const pulse = 0.65 + Math.sin(Date.now() * 0.007 + (pk.bobT || 0)) * 0.35;
    const py = pk.drawY ?? pk.y;
    ctx.save();

    if (pk.type === 'ammo') {
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ccff44'; ctx.fillRect(pk.x - 10, py - 2, 20, 10);
      ctx.fillStyle = '#eeff88'; ctx.fillRect(pk.x - 8,  py,      16,  4);
      ctx.fillStyle = '#aacc22'; ctx.font = 'bold 8px Courier New';
      ctx.textAlign = 'center'; ctx.fillText('AMMO', pk.x, py - 7); ctx.textAlign = 'left';

    } else if (pk.type === 'dmg') {
      // Red/orange flame — damage boost
      ctx.globalAlpha = pulse;
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff2200'; ctx.beginPath(); ctx.arc(pk.x, py, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff6600'; ctx.beginPath(); ctx.arc(pk.x, py, 9,  0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffdd00'; ctx.beginPath(); ctx.arc(pk.x, py, 5,  0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // Lightning bolt icon
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('⚡', pk.x, py + 4);
      ctx.fillStyle = '#ff8844'; ctx.font = 'bold 8px Courier New';
      ctx.fillText('DMG+', pk.x, py - 18); ctx.textAlign = 'left';

    } else if (pk.type === 'inv') {
      // Blue/cyan — overshield
      ctx.globalAlpha = pulse;
      ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#0044aa'; ctx.beginPath(); ctx.arc(pk.x, py, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0088ee'; ctx.beginPath(); ctx.arc(pk.x, py, 9,  0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#44ddff'; ctx.beginPath(); ctx.arc(pk.x, py, 5,  0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
      ctx.fillText('🛡', pk.x, py + 4);
      ctx.fillStyle = '#44ccff'; ctx.font = 'bold 8px Courier New';
      ctx.fillText('INV', pk.x, py - 18); ctx.textAlign = 'left';

    } else if (pk.type === 'heal') {
      // Green cross — heal
      ctx.globalAlpha = pulse;
      ctx.shadowColor = '#00ff66'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#004422'; ctx.beginPath(); ctx.arc(pk.x, py, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#00aa44'; ctx.beginPath(); ctx.arc(pk.x, py, 9,  0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#44ff88'; ctx.beginPath(); ctx.arc(pk.x, py, 5,  0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      // Cross shape
      ctx.fillStyle = '#fff';
      ctx.fillRect(pk.x - 6, py - 2, 12, 4);
      ctx.fillRect(pk.x - 2, py - 6, 4, 12);
      ctx.fillStyle = '#88ffaa'; ctx.font = 'bold 8px Courier New';
      ctx.textAlign = 'center'; ctx.fillText('HEAL', pk.x, py - 18); ctx.textAlign = 'left';
    }

    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.ml);
    ctx.fillStyle = p.col;
    ctx.shadowColor = p.col; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Enemy bullets
  for (const b of eBullets) {
    ctx.save();
    ctx.fillStyle = b.col;
    ctx.shadowColor = b.col; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    // Trail
    ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(b.x - b.vx*1.5, b.y - b.vy*1.5, b.r * 0.7, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Player bullets — color varies with dmg boost
  for (const b of bullets) {
    ctx.save();
    const bc = b.col || '#ffe044';
    ctx.fillStyle = bc;
    ctx.shadowColor = bc; ctx.shadowBlur = b.dmg > 1 ? 14 : 6;
    ctx.fillRect(b.x - 8, b.y - 2, 14, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(b.x - 6, b.y - 1, 6, 2);
    ctx.restore();
  }

  // Enemies
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.type === 'grunt')  drawGrunt(e.x, e.y, e.facing, e.walkT);
    else if (e.type === 'elite') drawElite(e.x, e.y, e.facing, e.walkT);
    else if (e.type === 'hunter') drawHunter(e.x, e.y, e.facing, e.walkT);
    else if (e.type === 'boss')   drawBoss(e.x, e.y, e.facing, e.walkT, e.tier || 1);

    // HP bar
    const hp = e.hp / e.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(e.x, e.y - 9, e.w, 5);
    ctx.fillStyle = hp > 0.5 ? '#44ff44' : hp > 0.25 ? '#ffaa22' : '#ff2222';
    ctx.fillRect(e.x, e.y - 9, e.w * hp, 5);
    ctx.strokeStyle = '#224422'; ctx.lineWidth = 0.5;
    ctx.strokeRect(e.x, e.y - 9, e.w, 5);
  }

  // Player
  if (gs === 'playing' || gs === 'wave_clear') {
    // Power-up aura ring
    if (player.pwrInv > 0) {
      const ap = 0.3 + Math.sin(Date.now() * 0.015) * 0.2;
      ctx.save();
      ctx.strokeStyle = `rgba(0,200,255,${ap})`;
      ctx.lineWidth = 5;
      ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.ellipse(player.x + 14, player.y + 24, 26, 32, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    if (player.pwrDmg > 0) {
      const ap = 0.25 + Math.sin(Date.now() * 0.018) * 0.2;
      ctx.save();
      ctx.strokeStyle = `rgba(255,80,0,${ap})`;
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.ellipse(player.x + 14, player.y + 24, 22, 28, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
    drawChief(player.x, player.y, player.facing, player.walkT, player.shield, player.invincible);
  }

  drawHUD();

  if (gs === 'gameover')   drawGameOver();
  if (gs === 'wave_clear') drawWaveClear();

  ctx.restore();
}

// ── GAME LOOP ─────────────────────────────────
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
